backend:
  name: github
  repo: jarinworks-co/jarinworks
  branch: main
  base_url: https://jarinworks.com
  auth_endpoint: api/auth

site_url: https://jarinworks.com
display_url: https://jarinworks.com
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Website content
    editor: { preview: false }
    files:
      - label: "1. Profile, hero & contact"
        name: profile
        file: content/profile.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: "Header logo — 400×100px, transparent PNG or SVG (shown 40px tall; optional, replaces name)", name: logo, widget: image, required: false }
          - { label: "Footer logo — 400×100px, transparent PNG or SVG, light colours for the dark footer (optional)", name: logo_light, widget: image, required: false }
          - { label: "Favicon — 512×512px square PNG (browser tab icon)", name: favicon, widget: image, required: false }
          - { label: Label above headline, name: label, widget: string }
          - { label: Headline, name: headline, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: "Headshot — 1200×1500px (4:5), cut-out PNG with transparent background, under 1 MB", name: headshot, widget: image, required: false }
          - { label: "Headshot is a cut-out (transparent background)", name: headshot_cutout, widget: boolean, default: true, required: false }
          - { label: "CV — PDF, under 2 MB", name: cv_file, widget: file, required: false }
          - { label: Award badge in hero (leave empty to hide), name: award_badge, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: "Phone (shown on hero button, contact & footer — e.g. +880 1772-950568)", name: phone, widget: string, required: false }
          - { label: "WhatsApp number (optional — leave empty to use the phone number)", name: whatsapp, widget: string, required: false }
          - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - { label: Location, name: location, widget: string, required: false }
          - { label: Open-to-roles line, name: open_to, widget: string, required: false }
          - { label: "Header dropdown name (groups Featured work, Speaking, Writing)", name: work_menu_label, widget: string, default: "My work", required: false }
          - { label: "Contact section name (header/footer menus)", name: contact_label, widget: string, default: "Contact", required: false }
          - { label: Contact heading, name: contact_heading, widget: string }
          - { label: Google description (SEO), name: seo_description, widget: text }

      - label: "2. Worked with (logos)"
        name: companies
        file: content/companies.json
        fields:
          - { label: Label, name: label, widget: string, default: "Where I've worked", required: false }
          - { label: Sub-label (optional — leave empty to hide), name: sublabel, widget: string, required: false }
          - label: Companies
            name: items
            widget: list
            fields:
              - { label: "Logo — 300×80px, transparent PNG or SVG, tightly cropped (shown 40px tall)", name: logo, widget: image }
              - { label: Company name (not shown — for screen readers & Google), name: name, widget: string, required: false }

      - label: "3. Metric tiles (auto-sliding)"
        name: metrics
        file: content/metrics.json
        fields:
          - label: "Tiles — add as many as you like; they scroll automatically"
            name: items
            widget: list
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label, name: label, widget: string }

      - label: "4. Award"
        name: award
        file: content/award.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Award", required: false }
          - { label: Show award section, name: show, widget: boolean, default: true }
          - { label: Award label, name: label, widget: string }
          - { label: Category line, name: category, widget: string }
          - { label: Campaign title (Bangla), name: title_bn, widget: string }
          - { label: English line, name: title_en, widget: string, required: false }
          - { label: "Award photo — 1200×1000px JPG, under 400 KB", name: photo, widget: image, required: false }

      - label: "5. Videos"
        name: videos
        file: content/videos.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Featured work", required: false }
          - { label: Heading, name: heading, widget: string }
          - label: Videos
            name: items
            widget: list
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: Category, name: category, widget: select, options: ["AI Content", "Talking Head", "Directional", "Online Content", "Voice Over", "Documentary"] }
              - { label: Title, name: title, widget: string }
              - { label: Brand / client, name: brand, widget: string, required: false }
              - { label: Video URL (YouTube, Facebook, Drive, Vimeo), name: url, widget: string, required: false }
              - { label: "Custom thumbnail — 1280×720px (16:9) JPG, under 300 KB (optional — YouTube auto-fills)", name: thumbnail, widget: image, required: false }

      - label: "6. How I work"
        name: process
        file: content/process.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "How I work", required: false }
          - { label: Heading, name: heading, widget: string }
          - label: Steps
            name: steps
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: string }
              - { label: Deliverable tag, name: deliverable, widget: string, required: false }

      - label: "7. Speaking & workshops"
        name: speaking
        file: content/speaking.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Speaking & workshops", required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Workshops
            name: items
            widget: list
            summary: "{{fields.venue}}"
            fields:
              - { label: Venue, name: venue, widget: string }
              - { label: Topic · Year, name: topic, widget: string }
              - { label: Format, name: mode, widget: select, options: ["Offline", "Online"] }
              - label: Videos (shown first)
                name: videos
                widget: list
                required: false
                summary: "{{fields.url}}"
                fields:
                  - { label: Video URL (YouTube, Facebook, Drive, Vimeo), name: url, widget: string }
                  - { label: "Thumbnail — 1280×720px (16:9) JPG, under 300 KB (optional — YouTube auto-fills)", name: thumbnail, widget: image, required: false }
              - label: Photos (first = cover)
                name: photos
                widget: list
                required: false
                fields:
                  - { label: "Photo — 1200×900px (4:3) JPG, under 400 KB", name: image, widget: image }

      - label: "8. Journey"
        name: journey
        file: content/journey.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Journey", required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Roles (newest first)
            name: items
            widget: list
            summary: "{{fields.years}} — {{fields.title}}"
            fields:
              - { label: Years, name: years, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Company, name: company, widget: string }
              - label: Highlights (bullet points, up to 4)
                name: highlights
                widget: list
                required: false
                max: 4
                field: { label: Point, name: point, widget: string }

      - label: "9. Writing"
        name: writing
        file: content/writing.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Writing", required: false }
          - { label: Heading, name: heading, widget: string }
          - label: Articles
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Publication, name: publication, widget: string, required: false }
              - { label: Type (Blog, Web copy…), name: type, widget: string, required: false }
              - { label: Language, name: language, widget: select, options: ["English", "Bangla"] }
              - { label: Link, name: url, widget: string, required: false }
              - { label: "Thumbnail — 1200×675px (16:9) JPG, under 300 KB", name: thumbnail, widget: image, required: false }

      - label: "10. Capabilities & toolkit"
        name: capabilities
        file: content/capabilities.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Capabilities", required: false }
          - { label: Toolkit title, name: toolkit_label, widget: string, default: "Toolkit", required: false }
          - { label: Toolkit subtitle, name: toolkit_subtitle, widget: string, default: "Tools I use every day", required: false }
          - { label: Heading, name: heading, widget: string }
          - label: Cards
            name: cards
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: string }
              - { label: Skills, name: skills, widget: list, field: { label: Skill, name: skill, widget: string } }
          - label: Toolkit (grouped by category)
            name: tools
            widget: list
            summary: "{{fields.category}} — {{fields.name}}"
            fields:
              - { label: Tool name, name: name, widget: string }
              - { label: "Category (leave empty = auto for common tools)", name: category, widget: select, required: false, options: ["SEO", "Design", "Marketing", "Analytics", "Content & CMS", "AI", "Video", "Other"] }
              - { label: "Logo — 128×128px square, transparent PNG or SVG (optional)", name: logo, widget: image, required: false }

      - label: "11. Certifications"
        name: certifications
        file: content/certifications.json
        fields:
          - { label: "Section name (shown above the heading + in header/footer menus)", name: menu_label, widget: string, default: "Certifications", required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Count badge, name: badge, widget: string, required: false }
          - label: Certificates
            name: items
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Issuer, name: issuer, widget: string }
              - { label: Credential link, name: url, widget: string, required: false }
              - { label: "Issuer logo — 256×256px square, transparent PNG or SVG (optional)", name: logo, widget: image, required: false }

      - label: "12. Footer"
        name: footer
        file: content/footer.json
        fields:
          - { label: Tagline, name: tagline, widget: string, required: false }
          - label: Social links (empty URL = hidden)
            name: socials
            widget: list
            fields:
              - { label: Label (e.g. LinkedIn), name: label, widget: string }
              - { label: URL, name: url, widget: string, required: false }
          - { label: Show "Back to top" link, name: show_back_to_top, widget: boolean, default: true }
